  "justfile",
  "Makefile",
  "build.ps1",
  "build_linux.sh",
  "include/**",
  "src/**",
  "test/**",
  "tests/**",
  "reference/**",
  "examples/**",
  "schema/**",
  "scripts/**",
  "web/**",
  "lean/**",
  "data/**",
  "timestamps/**",
