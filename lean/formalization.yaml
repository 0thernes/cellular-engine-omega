    local_windows: true
    ci_ubuntu: true
  - name: "nanoda_bin (Rust independent checker)"
    role: "independent"
    local_windows: true
    ci_ubuntu: true
  - name: "con-leche (--verified independent export checker)"
    role: "independent"
    local_windows: true
    ci_ubuntu: true
  - name: "con-ron (--verified independent export checker)"
    role: "independent"
    local_windows: true
    ci_ubuntu: true
  - name: "lean4lean (independent Lean-in-Lean checker via lake check --paranoid & lake comparator)"
    role: "independent"
    local_windows: false
    ci_ubuntu: true
scope_and_non_formalized_disclaimers:
  formalized_in_lean:
    - "Discrete Nat/Int/List algebraic, combinatorial, and inductive invariants of the software model (O01-O62, O01b, O41b, O59b, O67-O71), including 16 closed literal arithmetic/receipt checks"
    - "C11-exported runtime literal equality checks in LiveC11Receipt.lean for TB14+TB16 (O63) and 75-substrate/1,000-cell Hybrid Cube (O72) — no SHA-256 hash is computed inside Lean"
    - "Explicit non-vacuity inhabitants, sharp negative-boundary refutations, and constructive adversarial refutations across all domains (O73-O100)"
  not_formalized_in_lean:
    - "IEEE-754 floating-point PDE solvers (Cahn-Hilliard, Schnakenberg, Hepatic Sinusoid, Levin Vmem), ODE integrators, stochastic Gillespie/Langevin/Cohesin Monte Carlo loops, cyclic Jacobi eigensolver, Snell ray tracer, and Ridge regression in C11 (verified empirically by 60 gates, 16 planted mutants, 10-seed sweeps, and 256-case fuzz/property harness)"
    - "C11 memory safety and compiler code generation (verified empirically by -Wall -Wextra -Wshadow -Werror, ASan/UBSan in CI, and libFuzzer-compatible harness)"
statement_fidelity_audit: "docs/statement-fidelity.md"
