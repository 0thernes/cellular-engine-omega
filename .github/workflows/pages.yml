# SPDX-License-Identifier: Apache-2.0
name: Deploy GitHub Pages (Showcase, Lean Proof Blueprint & White Paper)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble static site bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/blueprint
          cp -r pages/* _site/
          cp -r blueprint/* _site/blueprint/
          cp dist/Donahue_2026_cellular_engine_omega.pdf _site/
          cp docs/media/observatory_snapshot.png _site/
          cp croissant.json ro-crate-metadata.json codemeta.json llms.txt llms-full.txt _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
