name: Bug or Verification Defect
description: Report a bug, numerical discrepancy, formal proof defect, or verification failure
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: finding_class
    attributes:
      label: Finding Class (Build Standard v1.2.0)
      options:
        - bug
        - error
        - issue
        - problem
        - concern
        - dilemma
        - conflict
        - gap
        - hole
        - blindspot
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit SHA
      placeholder: "v5.2.0 / git rev-parse HEAD"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproduction Steps
      placeholder: "Exact CLI flags, seed, OS, compiler, and expected vs actual output."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / SHA-256 Digests / Lean Output
      render: shell
